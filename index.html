<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STREET FOOTBALL</title>
    <style>
        * { margin: 0; padding: 0; touch-action: none; user-select: none; }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
            color: white;
        }
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 850px;
            background: #0a0a12;
            border-radius: 20px;
            overflow: hidden;
        }
        canvas {
            background: #1a1a2e;
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            border: 3px solid #2a2a4a;
        }
        /* ===== МЕНЮ ===== */
        #menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10,10,18,0.92);
            backdrop-filter: blur(12px);
            z-index: 10;
            color: white;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        #menu .logo {
            font-size: 2.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 2px;
        }
        #menu .logo small {
            font-size: 0.7rem;
            display: block;
            -webkit-text-fill-color: #888;
            color: #888;
        }
        .user-bar {
            display: flex;
            gap: 16px;
            background: rgba(255,255,255,0.05);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 10px;
        }
        .user-bar .stars { color: #ffd700; }
        .user-bar .diamonds { color: #00e5ff; }
        .menu-tabs {
            display: flex;
            gap: 6px;
            margin: 8px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .menu-tab {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 6px 16px;
            color: #aaa;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-tab.active { background: rgba(255,215,0,0.12); border-color: #ffd700; color: #ffd700; }
        .menu-tab:active { transform: scale(0.94); }
        .tab-content {
            width: 100%;
            max-width: 360px;
            margin: 6px 0;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .tab-content.active { display: flex; }
        .mode-select {
            display: flex;
            gap: 12px;
            margin: 4px 0;
        }
        .mode-btn {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 8px 20px;
            color: #aaa;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn.active { border-color: #ffd700; background: rgba(255,215,0,0.08); color: #ffd700; }
        .mode-btn:active { transform: scale(0.94); }
        .players {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 340px;
            margin: 6px 0;
        }
        .player-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 10px 4px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
        }
        .player-card:active { transform: scale(0.94); background: rgba(255,215,0,0.06); border-color: #ffd700; }
        .player-card .number { font-size: 1.6rem; display: block; color: #ffd700; }
        .player-card .rating { font-size: 0.7rem; display: block; color: #666; }
        .player-card .name { font-size: 0.7rem; }
        .player-card.selected { border-color: #ffd700; background: rgba(255,215,0,0.06); color: white; }
        .difficulty {
            display: flex;
            gap: 6px;
            margin: 6px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .diff-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 4px 14px;
            color: #888;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .diff-btn.active { border-color: #ffd700; color: #ffd700; background: rgba(255,215,0,0.06); }
        .diff-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #startBtn {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border: none;
            color: #1a1a2e;
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 900;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 30px rgba(255,215,0,0.15);
            width: 100%;
            max-width: 280px;
        }
        #startBtn:active { transform: scale(0.94); }
        #startBtn:disabled { opacity: 0.3; transform: none; cursor: not-allowed; }
        .inventory-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 340px;
        }
        .inv-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px 4px;
            text-align: center;
            font-size: 0.7rem;
            color: #aaa;
        }
        .inv-item .icon { font-size: 2rem; }
        .rank-table {
            width: 100%;
            max-width: 340px;
            font-size: 0.8rem;
            border-collapse: collapse;
        }
        .rank-table th { text-align: left; padding: 6px 8px; color: #666; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .rank-table td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .rank-table .pos { color: #666; width: 30px; }
        .rank-table .name { color: #fff; }
        .rank-table .score { color: #ffd700; text-align: right; }
        .pack-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 340px;
        }
        .pack-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .pack-card:active { transform: scale(0.94); background: rgba(255,215,0,0.04); }
        .pack-card .icon { font-size: 2.4rem; }
        .pack-card .price { color: #ffd700; font-size: 0.8rem; }
        /* ===== ИГРОВОЙ ИНТЕРФЕЙС ===== */
        #scoreboard {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 14px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 5;
            text-shadow: 0 2px 12px black;
            pointer-events: none;
            box-sizing: border-box;
        }
        #scoreboard div { background: rgba(0,0,0,0.5); padding: 4px 14px; border-radius: 30px; }
        #timer {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: #ffd700;
            padding: 4px 20px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
        }
        #currencyBar {
            position: absolute;
            top: 56px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 6;
            text-shadow: 0 2px 8px black;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 4px 0;
        }
        #currencyBar .stars { color: #ffd700; }
        #currencyBar .diamonds { color: #00e5ff; }
        #matchScore {
            position: absolute;
            bottom: 120px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 0.9rem;
            z-index: 5;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 4px 0;
        }
        #winner {
            position: absolute;
            top: 30%;
            left: 0; width: 100%;
            text-align: center;
            color: gold;
            font-size: 2.8rem;
            text-shadow: 0 0 40px black;
            z-index: 20;
            pointer-events: none;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 24px 0;
        }
        #winner .cup { font-size: 4rem; display: block; }
        #restartBtn {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #f7971e;
            border: none;
            color: #1a1a2e;
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 1.1rem;
            z-index: 30;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            display: none;
            cursor: pointer;
        }
        #restartBtn:active { transform: translateX(-50%) scale(0.94); }
        #menuBtn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-weight: bold;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 1rem;
            z-index: 30;
            display: none;
            cursor: pointer;
        }
        #menuBtn:active { transform: translateX(-50%) scale(0.94); }
        /* ===== УПРАВЛЕНИЕ ===== */
        #joystick-area {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            border-radius: 60px;
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.06);
            z-index: 8;
            display: none;
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background: rgba(255,255,255,0.15);
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 30px rgba(255,255,255,0.03);
        }
        .action-btn {
            position: absolute;
            bottom: 30px;
            width: 64px;
            height: 64px;
            border-radius: 32px;
            border: 2px solid rgba(255,255,255,0.1);
            color: white;
            font-size: 0.6rem;
            font-weight: bold;
            z-index: 8;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: 0.1s;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(4px);
        }
        .action-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.06); }
        #kick-btn { right: 100px; border-color: rgba(255,215,0,0.3); color: #ffd700; }
        #pass-btn { right: 28px; border-color: rgba(0,229,255,0.3); color: #00e5ff; }
        #tackle-btn { right: 172px; border-color: rgba(255,100,100,0.3); color: #ff6b6b; }
        .action-btn .icon { font-size: 1.4rem; line-height: 1; }
        .action-btn .label { font-size: 0.5rem; opacity: 0.7; }
        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #ffd700;
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255,215,0,0.2);
            z-index: 50;
            display: none;
            text-align: center;
            font-size: 1.2rem;
            max-width: 80%;
            backdrop-filter: blur(8px);
        }
        #notification .sub { font-size: 0.9rem; color: #aaa; margin-top: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div id="game-wrapper">
    <canvas id="gameCanvas" width="600" height="800"></canvas>

    <!-- ===== МЕНЮ ===== -->
    <div id="menu">
        <div class="logo">⚽ STREET<br><small>FOOTBALL</small></div>
        <div class="user-bar">
            <span>👤 Гость</span>
            <span class="stars">⭐ <span id="menuStars">50</span></span>
            <span class="diamonds">💎 <span id="menuDiamonds">100</span></span>
        </div>
        <div class="menu-tabs">
            <button class="menu-tab active" data-tab="match">🎮 Режим</button>
            <button class="menu-tab" data-tab="packs">📦 Паки</button>
            <button class="menu-tab" data-tab="inventory">🎒 Инвентарь</button>
            <button class="menu-tab" data-tab="rank">📊 Рейтинг</button>
        </div>

        <!-- Вкладка: Матч -->
        <div class="tab-content active
