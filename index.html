<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match Cup</title>
    <style>
        * { margin: 0; padding: 0; touch-action: none; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 850px;
        }
        canvas {
            background: #2e7d32;
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            border: 4px solid #fff;
        }
        #menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 10;
            color: white;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        #menu h1 {
            font-size: 2.6rem;
            margin-bottom: 4px;
            background: linear-gradient(45deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tab-select {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 6px 14px;
            color: #fff;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active { border-color: #ffd700; background: rgba(255,215,0,0.2); }
        .tab-btn:active { transform: scale(0.94); }
        #divisionInfo {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 10px 16px;
            margin: 8px 0;
            width: 100%;
            max-width: 340px;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #divisionInfo .stars { color: #ffd700; }
        #divisionInfo .diamonds { color: #00e5ff; }
        #divisionInfo .rating { color: #4caf50; }
        .pack-btn {
            background: rgba(255,215,0,0.15);
            border: 2px solid rgba(255,215,0,0.3);
            border-radius: 30px;
            padding: 6px 16px;
            color: #fff;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            margin: 4px;
        }
        .pack-btn:active { transform: scale(0.94); background: rgba(255,215,0,0.3); }
        .pack-btn.diamond {
            background: rgba(0,229,255,0.15);
            border-color: rgba(0,229,255,0.3);
        }
        .pack-btn.diamond:active { background: rgba(0,229,255,0.3); }
        .mode-select {
            display: flex;
            gap: 16px;
            margin: 8px 0;
        }
        .mode-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 8px 20px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn.active { border-color: #ffd700; background: rgba(255,215,0,0.2); }
        .mode-btn:active { transform: scale(0.94); }
        .players {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 340px;
            margin: 8px 0;
        }
        .player-card {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            padding: 12px 8px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
        }
        .player-card:active { transform: scale(0.94); background: rgba(255,215,0,0.2); border-color: gold; }
        .player-card .number { font-size: 1.6rem; display: block; color: #ffd700; }
        .player-card .rating { font-size: 0.9rem; display: block; color: #aaa; }
        .player-card .name { font-size: 0.8rem; }
        .player-card.selected { border-color: #ffd700; background: rgba(255,215,0,0.15); }
        .difficulty {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .diff-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            padding: 6px 16px;
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .diff-btn.active { border-color: #ffd700; background: rgba(255,215,0,0.2); }
        .diff-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #startBtn {
            background: #4caf50;
            border: none;
            color: #fff;
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(76,175,80,0.3);
        }
        #startBtn:active { transform: scale(0.94); }
        #startBtn:disabled { opacity: 0.4; transform: none; }
        #scoreboard {
            position: absolute;
            top: 12px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 16px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 5;
            text-shadow: 0 2px 12px black;
            pointer-events: none;
            box-sizing: border-box;
        }
        #scoreboard div { background: rgba(0,0,0,0.5); padding: 4px 14px; border-radius: 30px; }
        #timer {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: #ffd700;
            padding: 4px 20px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
        }
        #winner {
            position: absolute;
            top: 30%;
            left: 0; width: 100%;
            text-align: center;
            color: gold;
            font-size: 2.8rem;
            text-shadow: 0 0 40px black;
            z-index: 20;
            pointer-events: none;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 24px 0;
        }
        #winner .cup { font-size: 4rem; display: block; }
        #restartBtn {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #f7971e;
            border: none;
            color: #1a1a2e;
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 1.1rem;
            z-index: 30;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            display: none;
            cursor: pointer;
        }
        #restartBtn:active { transform: translateX(-50%) scale(0.94); }
        #menuBtn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            font-weight: bold;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 1rem;
            z-index: 30;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            display: none;
            cursor: pointer;
        }
        #menuBtn:active { transform: translateX(-50%) scale(0.94); }
        #matchScore {
            position: absolute;
            bottom: 120px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 0.9rem;
            z-index: 5;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 4px 0;
        }
        #joystick-area {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            border-radius: 60px;
            background: rgba(255,255,255,0.12);
            border: 3px solid rgba(255,255,255,0.25);
            z-index: 8;
            display: none;
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background: rgba(255,255,255,0.4);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #kick-btn {
            position: absolute;
            bottom: 30px;
            right: 100px;
            width: 70px;
            height: 70px;
            border-radius: 35px;
            background: rgba(255,215,0,0.25);
            border: 4px solid rgba(255,215,0,0.5);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 8;
            display: none;
            justify-content: center;
            align-items: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: 0.1s;
            box-shadow: 0 0 30px rgba(255,215,0,0.15);
            text-align: center;
            line-height: 1.2;
        }
        #kick-btn:active { transform: scale(0.92); background: rgba(255,215,0,0.5); }
        #tackle-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            width: 70px;
            height: 70px;
            border-radius: 35px;
            background: rgba(0,100,255,0.25);
            border: 4px solid rgba(0,100,255,0.5);
            color: white;
            font-size: 0.6rem;
            font-weight: bold;
            z-index: 8;
            display: none;
            justify-content: center;
            align-items: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: 0.1s;
            box-shadow: 0 0 30px rgba(0,100,255,0.15);
            text-align: center;
            line-height: 1.2;
        }
        #tackle-btn:active { transform: scale(0.92); background: rgba(0,100,255,0.5); }
        #resetBtn {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(255,0,0,0.25);
            border: 1px solid rgba(255,0,0,0.4);
            color: #ff6b6b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 15;
            transition: 0.2s;
        }
        #resetBtn:active { transform: scale(0.92); background: rgba(255,0,0,0.4); }
        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #ffd700;
            padding: 20px 30px;
            border-radius: 16px;
            border: 2px solid #ffd700;
            z-index: 50;
            display: none;
            text-align: center;
            font-size: 1.2rem;
            max-width: 80%;
        }
        .notification .sub { font-size: 0.9rem; color: #aaa; margin-top: 4px; }
    </style>
</head>
<body>
<div id="game-wrapper">
    <canvas id="gameCanvas" width="600" height="800"></canvas>

    <div id="menu">
        <button id="resetBtn">🗑️ Сброс</button>
        <h1>⚽ MATCH CUP</h1>
        <div class="tab-select">
            <button class="tab-btn active" data-tab="quick">⚡ Быстрый</button>
            <button class="tab-btn" data-tab="career">🏆 Карьера</button>
            <button class="tab-btn" data-tab="division">💎 Division</button>
        </div>
        <div id="tabContent">
            <div class="sub" style="margin-top:4px;">Выбери режим:</div>
            <div class="mode-select">
                <button class="mode-btn active" data-mode="2v2">2×2</button>
                <button class="mode-btn" data-mode="3v3">3×3</button>
            </div>
            <div class="sub" style="margin-top:4px;">Выбери игрока:</div>
            <div class="players" id="player-list"></div>
            <div style="font-size:0.8rem; color:#aaa; margin:4px 0;">Выбери сложность:</div>
            <div class="difficulty">
                <button class="diff-btn" data-diff="easy" disabled>🟢 Лёгкий</button>
                <button class="diff-btn" data-diff="medium" disabled>🟡 Средний</button>
                <button class="diff-btn" data-diff="hard" disabled>🔴 Сложный</button>
                <button class="diff-btn" data-diff="extreme" disabled>🔥 Хардкор</button>
            </div>
            <div id="divisionInfo" style="display:none;">
                <div>⭐ <span id="divStars">0</span> | 💎 <span id="divDiamonds">0</span> | 📈 <span id="divRating">50</span></div>
                <div style="margin-top:6px;">
                    <button class="pack-btn" id="starPackBtn">📦 Пак за 300⭐</button>
                    <button class="pack-btn diamond" id="diamondPackBtn">💎 Пак за 20💎</button>
                </div>
            </div>
            <button id="startBtn" disabled>▶️ НАЧАТЬ МАТЧ</button>
        </div>
    </div>

    <div id="scoreboard">
        <div id="scoreA">0</div>
        <div id="scoreB">0</div>
    </div>
    <div id="timer">⏱️ 1:00</div>
    <div id="matchScore">⚽ Счёт матча: 0 : 0</div>
    <div id="winner"><span class="cup">🏆</span>ПОБЕДА!</div>
    <button id="restartBtn">🔁 Играть снова</button>
    <button id="menuBtn">🏠 В меню</button>

    <div id="joystick-area"><div id="joystick-knob"></div></div>
    <div id="kick-btn">⚽<br>Удар</div>
    <div id="tackle-btn">⚔️<br>Отбор</div>
</div>

<div id="notification" class="notification">
    <div id="notifText">🎉</div>
    <div class="sub" id="notifSub"></div>
</div>

<script>
    // ============================================================
    //  MATCH CUP — БЫСТРЫЙ + КАРЬЕРА + DIVISION (С АЛМАЗАМИ)
    // ============================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 600, H = 800;
    canvas.width = W; canvas.height = H;

    // --- ЭЛЕМЕНТЫ ---
    const menu = document.getElementById('menu');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const menuBtn = document.getElementById('menuBtn');
    const winnerDiv = document.getElementById('winner');
    const scoreADiv = document.getElementById('scoreA');
    const scoreBDiv = document.getElementById('scoreB');
    const timerDiv = document.getElementById('timer');
    const matchScoreDiv = document.getElementById('matchScore');
    const joystickArea = document.getElementById('joystick-area');
    const joystickKnob = document.getElementById('joystick-knob');
    const kickBtn = document.getElementById('kick-btn');
    const tackleBtn = document.getElementById('tackle-btn');
    const resetBtn = document.getElementById('resetBtn');
    const divisionInfo = document.getElementById('divisionInfo');
    const divStarsSpan = document.getElementById('divStars');
    const divDiamondsSpan = document.getElementById('divDiamonds');
    const divRatingSpan = document.getElementById('divRating');
    const notifDiv = document.getElementById('notification');
    const notifText = document.getElementById('notifText');
    const notifSub = document.getElementById('notifSub');

    // --- СОСТОЯНИЕ ---
    let selectedPlayer = -1;
    let selectedDifficulty = 'easy';
    let selectedMode = '2v2';
    let selectedTab = 'quick';
    let gameState = 'menu';
    let matchActive = false;
    let timerInterval = null;
    let timeLeft = 60;
    let scoreA = 0, scoreB = 0;
    let winsA = 0, winsB = 0;
    const GOAL_LIMIT = 3;

    // --- ДЖОЙСТИК ---
    let joystickX = 0, joystickY = 0;
    let joystickActive = false;
    let joystickTouchId = null;

    // --- КНОПКИ ---
    let kickPressed = false;
    let tacklePressed = false;

    // --- ИГРОКИ ---
    let allPlayers = [];
    let ball = { x: W/2, y: H/2, r: 10, vx: 0, vy: 0 };
    let ballOwner = null;

    // --- ВОРОТА ---
    const GOAL_H = 75;
    const goalA = { x: 25, y: H/2 - GOAL_H/2, w: 18, h: GOAL_H };
    const goalB = { x: W-43, y: H/2 - GOAL_H/2, w: 18, h: GOAL_H };

    // --- ДАННЫЕ ИГРОКОВ ---
    const PLAYER_DB = {
        0: { id: 0, name: 'Хабиб', number: '7', color: '#d32f2f', rating: 72, role: 'attacker' },
        1: { id: 1, name: 'Азиз', number: '10', color: '#e57373', rating: 72, role: 'defender' },
        2: { id: 2, name: 'Шамиль Рб', number: '4', color: '#1976d2', rating: 69, role: 'attacker' },
        3: { id: 3, name: 'Шамиль Jr', number: '8', color: '#64b5f6', rating: 67, role: 'defender' },
        4: { id: 4, name: 'Салаудин', number: '11', color: '#42a5f5', rating: 67, role: 'attacker' },
        5: { id: 5, name: 'Абдул', number: '5', color: '#f06292', rating: 65, role: 'defender' }
    };

    // --- КАРЬЕРА ---
    function loadCareer() {
        try {
            const data = localStorage.getItem('matchcup_career');
            if (data) return JSON.parse(data);
        } catch(e) {}
        return { playerId: null, rating: 50, wins: 0, goals: 0, achievements: [] };
    }
    let career = loadCareer();
    function saveCareer() { localStorage.setItem('matchcup_career', JSON.stringify(career)); }

    // --- DIVISION ---
    function loadDivision() {
        try {
            const data = localStorage.getItem('matchcup_division');
            if (data) return JSON.parse(data);
        } catch(e) {}
        return { stars: 0, diamonds: 0, packsOpened: 0, playerId: null, rating: 50 };
    }
    let division = loadDivision();
    function saveDivision() { localStorage.setItem('matchcup_division', JSON.stringify(division)); }

    // --- ПОЛУЧИТЬ РЕЙТИНГ ---
    function getPlayerRating(playerId, mode) {
        if (mode === 'quick') {
            return PLAYER_DB[playerId] ? PLAYER_DB[playerId].rating : 50;
        } else if (mode === 'career') {
            if (career.playerId === playerId) return career.rating;
            return PLAYER_DB[playerId] ? PLAYER_DB[playerId].rating : 50;
        } else if (mode === 'division') {
            if (division.playerId === playerId) return division.rating;
            return PLAYER_DB[playerId] ? PLAYER_DB[playerId].rating : 50;
        }
        return 50;
    }

    function getPlayerSpeedFromRating(rating) {
        return 1.0 + (rating - 50) * 0.12;
    }

    function getPlayerPowerFromRating(rating) {
        return 2.0 + (rating - 50) * 0.07;
    }

    // --- УВЕДОМЛЕНИЯ ---
    function showNotification(text, sub = '') {
        notifText.innerText = text;
        notifSub.innerText = sub;
        notifDiv.style.display = 'block';
        setTimeout(() => { notifDiv.style.display = 'none'; }, 3000);
    }

    // --- ПАКИ ---
    function openStarPack() {
        const packsAvailable = Math.floor(division.stars / 300) - division.packsOpened;
        if (packsAvailable <= 0) {
            showNotification('❌ Нет доступных паков', 'Нужно 300⭐');
            return;
        }
        const gain = 1 + Math.floor(Math.random() * 5);
        division.rating = Math.min(99, division.rating + gain);
        division.packsOpened++;
        saveDivision();
        updateDivisionUI();
        showNotification('🎉 Пак открыт!', `Рейтинг +${gain} (${division.rating - gain} → ${division.rating})`);
    }

    function openDiamondPack() {
        if (division.diamonds < 20) {
            showNotification('❌ Недостаточно алмазов', 'Нужно 20💎');
            return;
        }
        const gain = 2 + Math.floor(Math.random() * 5);
        division.rating = Math.min(99, division.rating + gain);
        division.diamonds -= 20;
        saveDivision();
        updateDivisionUI();
        showNotification('💎 Алмазный пак!', `Рейтинг +${gain} (${division.rating - gain} → ${division.rating})`);
    }

    // --- ОБНОВЛЕНИЕ DIVISION UI ---
    function updateDivisionUI() {
        divStarsSpan.innerText = division.stars;
        divDiamondsSpan.innerText = division.diamonds;
        divRatingSpan.innerText = division.rating;
    }

    // --- ПОСТРОЕНИЕ МЕНЮ ---
    function buildPlayerMenu() {
        const list = document.getElementById('player-list');
        list.innerHTML = '';
        const ids = [0, 1, 2, 3, 4, 5];
        ids.forEach(id => {
            const p = PLAYER_DB[id];
            const rating = getPlayerRating(id, selectedTab);
            const card = document.createElement('div');
            card.className = 'player-card';
            card.dataset.player = p.id;
            card.innerHTML = `
                <span class="number">#${p.number}</span>
                <span class="name">${p.name}</span>
                <span class="rating">${rating}</span>
            `;
            card.addEventListener('click', function() {
                document.querySelectorAll('.player-card').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                selectedPlayer = parseInt(this.dataset.player);
                startBtn.disabled = false;
                document.querySelectorAll('.diff-btn').forEach(b => b.disabled = false);
                // Если Division — устанавливаем игрока
                if (selectedTab === 'division') {
                    division.playerId = selectedPlayer;
                    if (division.rating < 50) division.rating = PLAYER_DB[selectedPlayer].rating;
                    saveDivision();
                    updateDivisionUI();
                }
            });
            list.appendChild(card);
        });
    }

    // --- ИНИЦИАЛИЗАЦИЯ ИГРОКОВ ---
    function initPlayers() {
        const ids = [0, 1, 2, 3, 4, 5];
        const teamA_ids = [0, 1, 5];
        const teamB_ids = [2, 3, 4];

        let teamA_data = [];
        let teamB_data = [];

        if (selectedTab === 'division') {
            // Division: 1 игрок (ты) + 1 бот против 3 ботов
            const myId = selectedPlayer;
            const botId = (myId === 0 || myId === 1 || myId === 5) ? 1 : 0;
            const myRating = getPlayerRating(myId, 'division');
            const botRating = getPlayerRating(botId, 'division');
            // Твоя команда (А): ты + бот
            const myData = { ...PLAYER_DB[myId], rating: myRating, isPlayer: true, team: 'A', isGoalkeeper: false, speed: getPlayerSpeedFromRating(myRating) * 1.6, power: getPlayerPowerFromRating(myRating) * 1.4, role: 'attacker' };
            const botData = { ...PLAYER_DB[botId], rating: botRating, isPlayer: false, team: 'A', isGoalkeeper: false, speed: getPlayerSpeedFromRating(botRating) * 1.6, power: getPlayerPowerFromRating(botRating) * 1.4, role: 'defender' };
            teamA_data = [myData, botData];
            // Команда Б: 3 бота
            const enemyIds = [2, 3, 4];
            enemyIds.forEach(id => {
                const p = PLAYER_DB[id];
                const rating = p.rating;
                teamB_data.push({
                    ...p,
                    rating: rating,
                    isPlayer: false,
                    team: 'B',
                    isGoalkeeper: false,
                    speed: getPlayerSpeedFromRating(rating) * 1.6,
                    power: getPlayerPowerFromRating(rating) * 1.4,
                    role: 'attacker'
                });
            });
            // Вратарь в команде Б
            if (teamB_data.length > 0) {
                teamB_data[0].isGoalkeeper = true;
                teamB_data[0].x = W-55;
                teamB_data[0].y = H/2;
            }
            // Вратарь в команде А
            if (teamA_data.length > 0) {
                teamA_data[0].isGoalkeeper = true;
                teamA_data[0].x = 55;
                teamA_data[0].y = H/2;
            }
            // Если игрок вратарь — делаем полевым
            const myPlayer = teamA_data.find(p => p.isPlayer);
            if (myPlayer && myPlayer.isGoalkeeper) {
                myPlayer.isGoalkeeper = false;
                myPlayer.x = 180;
                myPlayer.y = H/2;
            }
        } else {
            // Обычный режим 2v2 или 3v3
            teamA_ids.forEach(id => {
                const p = PLAYER_DB[id];
                const rating = getPlayerRating(id, selectedTab);
                teamA_data.push({
                    ...p,
                    isPlayer: p.id === selectedPlayer,
                    team: 'A',
                    isGoalkeeper: false,
                    speed: getPlayerSpeedFromRating(rating) * 1.6,
                    power: getPlayerPowerFromRating(rating) * 1.4,
                    rating: rating,
                    role: p.role
                });
            });
            teamB_ids.forEach(id => {
                const p = PLAYER_DB[id];
                const rating = getPlayerRating(id, selectedTab);
                teamB_data.push({
                    ...p,
                    isPlayer: p.id === selectedPlayer,
                    team: 'B',
                    isGoalkeeper: false,
                    speed: getPlayerSpeedFromRating(rating) * 1.6,
                    power: getPlayerPowerFromRating(rating) * 1.4,
                    rating: rating,
                    role: p.role
                });
            });
        }

        // Расстановка позиций для 3v3
        if (selectedMode === '3v3' && selectedTab !== 'division') {
            teamA_data.forEach(p => {
                if (p.isGoalkeeper) { p.x = 55; p.y = H/2; }
                else if (p.role === 'defender') { p.x = 120; p.y = H/2; }
                else if (p.role === 'attacker') { p.x = 200; p.y = H/2 - 40; }
            });
            teamB_data.forEach(p => {
                if (p.isGoalkeeper) { p.x = W-55; p.y = H/2; }
                else if (p.role === 'defender') { p.x = W-120; p.y = H/2; }
                else if (p.role === 'attacker') { p.x = W-200; p.y = H/2 - 40; }
            });
        } else {
            // 2v2 или Division
            teamA_data.forEach((p, i) => {
                if (selectedTab === 'division') {
                    if (p.isPlayer) { p.x = 180; p.y = H/2; }
                    else { p.x = 120; p.y = H/2 + 60; }
                } else {
                    p.x = 120;
                    p.y = H/2 + (i === 0 ? -60 : 60);
                }
            });
            teamB_data.forEach((p, i) => {
                if (selectedTab === 'division') {
                    p.x = W-120 + (i * 40);
                    p.y = H/2 - 60 + (i * 60);
                } else {
                    p.x = W-120;
                    p.y = H/2 + (i === 0 ? -60 : 60);
                }
            });
            // Вратарь
            if (teamA_data.length > 0) {
                const gkA = teamA_data[0];
                gkA.isGoalkeeper = true;
                gkA.x = 55;
                gkA.y = H/2;
            }
            if (teamB_data.length > 0) {
                const gkB = teamB_data[0];
                gkB.isGoalkeeper = true;
                gkB.x = W-55;
                gkB.y = H/2;
            }
        }

        // Если игрок вратарь — делаем полевым
        const myPlayer = [...teamA_data, ...teamB_data].find(p => p.isPlayer);
        if (myPlayer && myPlayer.isGoalkeeper) {
            myPlayer.isGoalkeeper = false;
            myPlayer.x = 180 + (myPlayer.team === 'A' ? 0 : 240);
            myPlayer.y = H/2;
        }

        allPlayers = [...teamA_data, ...teamB_data];
        allPlayers.forEach(p => {
            if (p.isPlayer) p.color = '#ffd700';
            p.targetX = p.x + (Math.random()-0.5)*60;
            p.targetY = p.y + (Math.random()-0.5)*60;
            p.r = 20;
        });
        ballOwner = null;
        resetBall();
    }

    function resetBall() {
        ball.x = W/2 + (Math.random()*80-40);
        ball.y = H/2 + (Math.random()*80-40);
        ball.vx = 0;
        ball.vy = 0;
        ballOwner = null;
    }

    // --- ОТБОР ---
    function performTackle(player) {
        if (!player) return;
        let target = null;
        let minDist = 80;
        for (let p of allPlayers) {
            if (p === player || p.team === player.team) continue;
            if (p === ballOwner) {
                const dx = player.x - p.x;
                const dy = player.y - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < minDist) {
                    minDist = dist;
                    target = p;
                }
            }
        }
        if (target) {
            const chance = 0.25 + (getPlayerRating(selectedPlayer, selectedTab) - 50) * 0.005;
            if (Math.random() < chance) {
                ballOwner = player;
                ball.x = player.x + 25;
                ball.y = player.y;
                ball.vx = 0;
                ball.vy = 0;
                return true;
            }
        }
        return false;
    }

    // --- БОТЫ ---
    function updateBot(p, isTeamA) {
        const dx = ball.x - p.x;
        const dy = ball.y - p.y;
        const distToBall = Math.sqrt(dx*dx + dy*dy);

        let targetX = p.targetX, targetY = p.targetY;

        if (p.isGoalkeeper) {
            const goal = isTeamA ? goalA : goalB;
            const goalX = isTeamA ? 30 : W-30;
            if (distToBall < 200 && ball.x > goal.x - 30 && ball.x < goal.x + goal.w + 30) {
                const offset = 50 + Math.random() * 30;
                targetX = isTeamA ? goal.x + goal.w + offset : goal.x - offset;
                targetY = Math.max(goal.y + 15, Math.min(goal.y + goal.h - 15, ball.y));
            } else {
                targetX = goalX;
                targetY = H/2 + (Math.random()-0.5)*30;
            }
        } else {
            if (p.role === 'defender') {
                const goalX = isTeamA ? 80 : W-80;
                if (distToBall < 250) {
                    targetX = Math.max(goalX - 20, Math.min(goalX + 20, ball.x));
                    targetY = Math.max(100, Math.min(H-100, ball.y));
                } else {
                    targetX = goalX;
                    targetY = H/2 + (Math.random()-0.5)*60;
                }
            } else {
                if (distToBall < 350) {
                    targetX = ball.x + (Math.random()-0.5) * 60;
                    targetY = ball.y + (Math.random()-0.5) * 60;
                } else {
                    targetX = ball.x;
                    targetY = ball.y;
                }
                if (ballOwner && distToBall < 45 && Math.random() < 0.3) {
                    ballOwner = p;
                    ball.x = p.x + 25;
                    ball.y = p.y;
                    ball.vx = 0;
                    ball.vy = 0;
                }
                if (p === ballOwner && distToBall < 40 && Math.random() < 0.04) {
                    const targetGoalX = isTeamA ? W-40 : 20;
                    const targetGoalY = H/2 + (Math.random()-0.5)*60;
                    const kx = targetGoalX - ball.x;
                    const ky = targetGoalY - ball.y;
                    const kd = Math.sqrt(kx*kx + ky*ky) || 1;
                    const power = p.power * (selectedDifficulty === 'extreme' ? 1.5 : 1.0);
                    ball.vx = (kx / kd) * power;
                    ball.vy = (ky / kd) * power;
                    ballOwner = null;
                    return;
                }
            }
        }

        const dxT = targetX - p.x;
        const dyT = targetY - p.y;
        const distT = Math.sqrt(dxT*dxT + dyT*dyT);
        const spd = (p.speed || 1.6) * (0.85 + Math.random() * 0.3);

        if (distT > 4) {
            const move = spd / distT;
            p.x += dxT * move;
            p.y += dyT * move;
        } else {
            p.targetX = p.x + (Math.random()-0.5)*60;
            p.targetY = p.y + (Math.random()-0.5)*60;
        }

        if (p.isGoalkeeper) {
            const goal = isTeamA ? goalA : goalB;
            p.x = Math.max(goal.x - 50, Math.min(goal.x + goal.w + 50, p.x));
            p.y = Math.max(goal.y + 10, Math.min(goal.y + goal.h - 10, p.y));
        } else {
            p.x = Math.max(35, Math.min(W-35, p.x));
            p.y = Math.max(35, Math.min(H-35, p.y));
        }
        if (!p.isGoalkeeper) {
            if (p.x < goalA.x + goalA.w + 5 && p.y > goalA.y && p.y < goalA.y + goalA.h) {
                p.x = goalA.x + goalA.w + 5;
            }
            if (p.x > goalB.x - goalB.w - 5 && p.y > goalB.y && p.y < goalB.y + goalB.h) {
                p.x = goalB.x - goalB.w - 5;
            }
        }
    }

    // --- РИСОВАНИЕ ---
    function drawPlayer(p) {
        const isMy = p.isPlayer;
        const x = p.x, y = p.y, r = p.r || 20;
        
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = isMy ? 'gold' : '#222';
        ctx.lineWidth = isMy ? 3 : 2;
        ctx.stroke();
        
        ctx.fillStyle = 'white';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 4;
        ctx.shadowColor = 'black';
        ctx.fillText(p.number, x, y + 5);
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '8px sans-serif';
        ctx.shadowBlur = 4;
        ctx.shadowColor = 'black';
        ctx.fillText(p.name, x, y - r - 4);
        
        const rating = p.rating || 50;
        let color = '#ff6b6b';
        if (rating >= 80) color = '#4caf50';
        else if (rating >= 70) color = '#ffd700';
        else if (rating >= 60) color = '#ff9800';
        ctx.fillStyle = color;
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(rating, x, y - r - 18);
        ctx.shadowBlur = 0;
        
        if (p.isGoalkeeper) {
            ctx.fillStyle = '#ffd700';
            ctx.font = '14px sans-serif';
            ctx.fillText('🧤', x + r + 10, y);
        }
        if (!p.isGoalkeeper && !isMy) {
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.font = '8px sans-serif';
            const roleLabel = p.role === 'attacker' ? '⚡' : '🛡️';
            ctx.fillText(roleLabel, x, y + r + 14);
        }
        
        if (p === ballOwner) {
            ctx.strokeStyle = 'rgba(255,255,0,0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([3, 5]);
            ctx.beginPath();
            ctx.arc(x, y, r + 6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        const grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 400);
        grad.addColorStop(0, '#4caf50');
        grad.addColorStop(1, '#2e7d32');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 3;
        const r = 35;
        ctx.beginPath();
        ctx.moveTo(r, 5);
        ctx.lineTo(W-r, 5);
        ctx.quadraticCurveTo(W-5, 5, W-5, r);
        ctx.lineTo(W-5, H-r);
        ctx.quadraticCurveTo(W-5, H-5, W-r, H-5);
        ctx.lineTo(r, H-5);
        ctx.quadraticCurveTo(5, H-5, 5, H-r);
        ctx.lineTo(5, r);
        ctx.quadraticCurveTo(5, 5, r, 5);
        ctx.closePath();
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8,12]);
        ctx.beginPath();
        ctx.moveTo(W/2, 5);
        ctx.lineTo(W/2, H-5);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(W/2, H/2, 60, 0, Math.PI*2);
        ctx.stroke();

        ctx.strokeStyle = 'white';
        ctx.lineWidth = 4;
        ctx.strokeRect(goalA.x, goalA.y, goalA.w, goalA.h);
        ctx.beginPath();
        ctx.moveTo(goalA.x, goalA.y);
        ctx.lineTo(goalA.x + goalA.w, goalA.y);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(goalA.x, goalA.y, goalA.w, goalA.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        for (let i = 0; i < goalA.w; i += 10) {
            ctx.beginPath();
            ctx.moveTo(goalA.x + i, goalA.y);
            ctx.lineTo(goalA.x + i, goalA.y + goalA.h);
            ctx.stroke();
        }
        for (let i = 0; i < goalA.h; i += 10) {
            ctx.beginPath();
            ctx.moveTo(goalA.x, goalA.y + i);
            ctx.lineTo(goalA.x + goalA.w, goalA.y + i);
            ctx.stroke();
        }

        ctx.strokeStyle = 'white';
        ctx.lineWidth = 4;
        ctx.strokeRect(goalB.x, goalB.y, goalB.w, goalB.h);
        ctx.beginPath();
        ctx.moveTo(goalB.x, goalB.y);
        ctx.lineTo(goalB.x + goalB.w, goalB.y);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(goalB.x, goalB.y, goalB.w, goalB.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        for (let i = 0; i < goalB.w; i += 10) {
            ctx.beginPath();
            ctx.moveTo(goalB.x + i, goalB.y);
            ctx.lineTo(goalB.x + i, goalB.y + goalB.h);
            ctx.stroke();
        }
        for (let i = 0; i < goalB.h; i += 10) {
            ctx.beginPath();
            ctx.moveTo(goalB.x, goalB.y + i);
            ctx.lineTo(goalB.x + goalB.w, goalB.y + i);
            ctx.stroke();
        }

        for (let p of allPlayers) {
            drawPlayer(p);
        }

        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(ball.x-3, ball.y-3, 3, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fill();
    }

    // --- ОБНОВЛЕНИЕ ---
    function update() {
        if (gameState !== 'playing' || !matchActive) return;

        const myPlayer = allPlayers.find(p => p.isPlayer === true);
        const speedBonus = myPlayer ? getPlayerSpeedFromRating(myPlayer.rating) : 1;

        if (myPlayer && joystickActive) {
            const jx = joystickX, jy = joystickY;
            const dist = Math.sqrt(jx*jx + jy*jy);
            if (dist > 0.1) {
                const speed = 4.5 * speedBonus * Math.min(1, dist * 2);
                myPlayer.x += (jx / dist) * speed;
                myPlayer.y += (jy / dist) * speed;
            }
        }

        allPlayers.forEach(p => {
            if (!p.isGoalkeeper) {
                p.x = Math.max(35, Math.min(W-35, p.x));
                p.y = Math.max(35, Math.min(H-35, p.y));
            }
            if (!p.isGoalkeeper) {
                if (p.x < goalA.x + goalA.w + 5 && p.y > goalA.y && p.y < goalA.y + goalA.h) {
                    p.x = goalA.x + goalA.w + 5;
                }
                if (p.x > goalB.x - goalB.w - 5 && p.y > goalB.y && p.y < goalB.y + goalB.h) {
                    p.x = goalB.x - goalB.w - 5;
                }
            }
        });

        if (ballOwner) {
            const targetX = ballOwner.x + 25;
            const targetY = ballOwner.y;
            ball.x += (targetX - ball.x) * 0.25;
            ball.y += (targetY - ball.y) * 0.25;
            ball.vx = 0;
            ball.vy = 0;
        }

        allPlayers.filter(p => !p.isPlayer).forEach(p => {
            updateBot(p, p.team === 'A');
        });

        if (myPlayer && kickPressed && ballOwner === myPlayer) {
            const angle = Math.atan2(joystickY, joystickX);
            const power = 7 + (myPlayer.rating - 50) * 0.12;
            ball.vx = Math.cos(angle) * power * (0.9 + Math.random() * 0.2);
            ball.vy = Math.sin(angle) * power * (0.9 + Math.random() * 0.2);
            ballOwner = null;
            kickPressed = false;
        }

        if (myPlayer && tacklePressed) {
            performTackle(myPlayer);
            tacklePressed = false;
        }

        if (!ballOwner) {
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= 0.99;
            ball.vy *= 0.99;
            if (Math.abs(ball.vx) < 0.1) ball.vx = 0;
            if (Math.abs(ball.vy) < 0.1) ball.vy = 0;
        }

        for (let p of allPlayers) {
            if (p === ballOwner) continue;
            const dx = ball.x - p.x;
            const dy = ball.y - p.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < ball.r + (p.r || 20)) {
                const angle = Math.atan2(dy, dx);
                const overlap = (ball.r + (p.r || 20) - dist) * 0.5;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
                const force = (p.isPlayer ? 4.0 * speedBonus : 3.5) + Math.random()*2;
                ball.vx += Math.cos(angle) * force;
                ball.vy += Math.sin(angle) * force;
                if (!ballOwner && Math.random() < 0.25) {
                    ballOwner = p;
                    ball.vx *= 0.3;
                    ball.vy *= 0.3;
                }
            }
        }

        const cr = 35;
        if (ball.x < cr && ball.y < cr) {
            const dx = ball.x - cr, dy = ball.y - cr;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < cr - ball.r) {
                const angle = Math.atan2(dy, dx);
                ball.x = cr + Math.cos(angle) * (cr - ball.r);
                ball.y = cr + Math.sin(angle) * (cr - ball.r);
                const nx = Math.cos(angle), ny = Math.sin(angle);
                const dot = ball.vx * nx + ball.vy * ny;
                if (dot < 0) { ball.vx -= 2*dot*nx; ball.vy -= 2*dot*ny; ball.vx *= 0.7; ball.vy *= 0.7; }
            }
        } else if (ball.x > W-cr && ball.y < cr) {
            const dx = ball.x - (W-cr), dy = ball.y - cr;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < cr - ball.r) {
                const angle = Math.atan2(dy, dx);
                ball.x = W-cr + Math.cos(angle)*(cr-ball.r);
                ball.y = cr + Math.sin(angle)*(cr-ball.r);
                const nx = Math.cos(angle), ny = Math.sin(angle);
                const dot = ball.vx * nx + ball.vy * ny;
                if (dot < 0) { ball.vx -= 2*dot*nx; ball.vy -= 2*dot*ny; ball.vx *= 0.7; ball.vy *= 0.7; }
            }
        } else if (ball.x < cr && ball.y > H-cr) {
            const dx = ball.x - cr, dy = ball.y - (H-cr);
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < cr - ball.r) {
                const angle = Math.atan2(dy, dx);
                ball.x = cr + Math.cos(angle)*(cr-ball.r);
                ball.y = H-cr + Math.sin(angle)*(cr-ball.r);
                const nx = Math.cos(angle), ny = Math.sin(angle);
                const dot = ball.vx * nx + ball.vy * ny;
                if (dot < 0) { ball.vx -= 2*dot*nx; ball.vy -= 2*dot*ny; ball.vx *= 0.7; ball.vy *= 0.7; }
            }
        } else if (ball.x > W-cr && ball.y > H-cr) {
            const dx = ball.x - (W-cr), dy = ball.y - (H-cr);
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < cr - ball.r) {
                const angle = Math.atan2(dy, dx);
                ball.x = W-cr + Math.cos(angle)*(cr-ball.r);
                ball.y = H-cr + Math.sin(angle)*(cr-ball.r);
                const nx = Math.cos(angle), ny = Math.sin(angle);
                const dot = ball.vx * nx + ball.vy * ny;
                if (dot < 0) { ball.vx -= 2*dot*nx; ball.vy -= 2*dot*ny; ball.vx *= 0.7; ball.vy *= 0.7; }
            }
        }

        if (ball.y < ball.r + 5) { ball.y = ball.r + 5; ball.vy *= -0.6; }
        if (ball.y > H - ball.r - 5) { ball.y = H - ball.r - 5; ball.vy *= -0.6; }
        if (ball.x < ball.r + 5 && !(ball.y > goalA.y && ball.y < goalA.y + goalA.h)) {
            ball.x = ball.r + 5; ball.vx *= -0.6;
        }
        if (ball.x > W - ball.r - 5 && !(ball.y > goalB.y && ball.y < goalB.y + goalB.h)) {
            ball.x = W - ball.r - 5; ball.vx *= -0.6;
        }

        if (ball.x < goalA.x + goalA.w && ball.y > goalA.y + 5 && ball.y < goalA.y + goalA.h - 5) {
            if (!ballOwner || ballOwner.team !== 'A') {
                scoreB++;
                updateScoreDisplay();
                if (scoreB >= GOAL_LIMIT) { endMatch('B'); return; }
                resetBall();
            }
        }
        if (ball.x > goalB.x - goalB.w && ball.y > goalB.y + 5 && ball.y < goalB.y + goalB.h - 5) {
            if (!ballOwner || ballOwner.team !== 'B') {
                scoreA++;
                updateScoreDisplay();
                if (scoreA >= GOAL_LIMIT) { endMatch('A'); return; }
                resetBall();
            }
        }

        ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x));
        ball.y = Math.max(ball.r, Math.min(H - ball.r, ball.y));
    }

    // --- ТАЙМЕР ---
    function startMatch() {
        if (matchActive) return;
        matchActive = true;
        gameState = 'playing';
        timeLeft = 60;
        scoreA = 0;
        scoreB = 0;
        updateScoreDisplay();
        timerDiv.innerText = '⏱️ 1:00';
        winnerDiv.style.display = 'none';
        restartBtn.style.display = 'none';
        menuBtn.style.display = 'none';
        resetBall();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDiv.innerText = `⏱️ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                endMatch(null);
            }
        }, 1000);
    }

    function endMatch(winner) {
        matchActive = false;
        gameState = 'ended';
        let result = 'draw';
        if (winner === 'A') { winsA++; result = 'win'; }
        else if (winner === 'B') { winsB++; result = 'lose'; }
        else {
            if (scoreA > scoreB) { winsA++; result = 'win'; }
            else if (scoreB > scoreA) { winsB++; result = 'lose'; }
            else { result = 'draw'; }
        }

        // DIVISION: начисление звёзд и алмазов
        if (selectedTab === 'division') {
            let starsGain = 20;
            let diamondsGain = 0;
            if (result === 'win') { starsGain = 200; diamondsGain = 5; }
            else if (result === 'draw') { starsGain = 75; diamondsGain = 2; }
            division.stars += starsGain;
            division.diamonds += diamondsGain;
            saveDivision();
            updateDivisionUI();
            // Проверка паков
            const packsAvailable = Math.floor(division.stars / 300) - division.packsOpened;
            if (packsAvailable > 0) {
                showNotification('🎁 У тебя есть пак!', `Открой в меню Division`);
            }
        }

        // КАРЬЕРА: обновление рейтинга
        if (selectedTab === 'career' && selectedPlayer >= 0) {
            const myPlayer = allPlayers.find(p => p.isPlayer);
            if (myPlayer) {
                const playerId = myPlayer.id;
                if (career.playerId === playerId) {
                    let ratingGain = 0;
                    if (result === 'win') ratingGain += 1;
                    if (result === 'draw') ratingGain += 0.5;
                    ratingGain += Math.floor(scoreA + scoreB) * 0.1;
                    if (ratingGain > 0) {
                        career.rating = Math.min(99, career.rating + ratingGain);
                        career.wins += (result === 'win') ? 1 : 0;
                        career.goals += (myPlayer.team === 'A' ? scoreA : scoreB);
                        saveCareer();
                    }
                } else {
                    career.playerId = playerId;
                    career.rating = PLAYER_DB[playerId].rating;
                    career.wins = (result === 'win') ? 1 : 0;
                    career.goals = (myPlayer.team === 'A' ? scoreA : scoreB);
                    career.achievements = [];
                    if (result === 'win') career.rating = Math.min(99, career.rating + 1);
                    saveCareer();
                }
            }
        }

        winnerDiv.innerHTML = `<span class="cup">🏆</span> ${result === 'win' ? 'Победа!' : result === 'draw' ? 'Ничья!' : 'Поражение!'}`;
        winnerDiv.style.display = 'block';
        restartBtn.style.display = 'block';
        menuBtn.style.display = 'block';
    }

    function updateScoreDisplay() {
        scoreADiv.innerText = scoreA;
        scoreBDiv.innerText = scoreB;
        matchScoreDiv.innerText = `⚽ Счёт матча: ${scoreA} : ${scoreB}`;
    }

    // --- ЦИКЛ ---
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // --- СОБЫТИЯ ---
    document.querySelectorAll('.tab-btn').forEach(el => {
        el.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            selectedTab = this.dataset.tab;
            selectedPlayer = -1;
            startBtn.disabled = true;
            document.querySelectorAll('.diff-btn').forEach(b => b.disabled = true);
            document.querySelectorAll('.player-card').forEach(c => c.classList.remove('selected'));
            // Показываем Division info
            if (selectedTab === 'division') {
                divisionInfo.style.display = 'block';
                updateDivisionUI();
            } else {
                divisionInfo.style.display = 'none';
            }
            buildPlayerMenu();
        });
    });

    document.querySelectorAll('.mode-btn').forEach(el => {
        el.addEventListener('click', function() {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            selectedMode = this.dataset.mode;
            selectedPlayer = -1;
            startBtn.disabled = true;
            document.querySelectorAll('.diff-btn').forEach(b => b.disabled = true);
            document.querySelectorAll('.player-card').forEach(c => c.classList.remove('selected'));
            buildPlayerMenu();
        });
    });

    document.querySelectorAll('.diff-btn').forEach(el => {
        el.addEventListener('click', function() {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            selectedDifficulty = this.dataset.diff;
        });
    });

    document.getElementById('starPackBtn').addEventListener('click', openStarPack);
    document.getElementById('diamondPackBtn').addEventListener('click', openDiamondPack);

    startBtn.addEventListener('click', function() {
        if (selectedPlayer === -1) return;
        menu.style.display = 'none';
        joystickArea.style.display = 'block';
        kickBtn.style.display = 'flex';
        tackleBtn.style.display = 'flex';
        initPlayers();
        startMatch();
    });

    resetBtn.addEventListener('click', function() {
        if (confirm('Сбросить весь прогресс?')) {
            localStorage.removeItem('matchcup_save');
            localStorage.removeItem('matchcup_career');
            localStorage.removeItem('matchcup_division');
            career = { playerId: null, rating: 50, wins: 0, goals: 0, achievements: [] };
            division = { stars: 0, diamonds: 0, packsOpened: 0, playerId: null, rating: 50 };
            saveCareer();
            saveDivision();
            updateDivisionUI();
            alert('Прогресс сброшен!');
        }
    });

    restartBtn.addEventListener('click', function() {
        winnerDiv.style.display = 'none';
        restartBtn.style.display = 'none';
        menuBtn.style.display = 'none';
        initPlayers();
        startMatch();
    });

    menuBtn.addEventListener('click', function() {
        winnerDiv.style.display = 'none';
        restartBtn.style.display = 'none';
        menuBtn.style.display = 'none';
        joystickArea.style.display = 'none';
        kickBtn.style.display = 'none';
        tackleBtn.style.display = 'none';
        menu.style.display = 'flex';
        gameState = 'menu';
        matchActive = false;
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        buildPlayerMenu();
    });

    // --- ДЖОЙСТИК ---
    joystickArea.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        joystickTouchId = touch.identifier;
        joystickActive = true;
        updateJoystick(touch);
    }, { passive: false });

    joystickArea.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let touch of e.touches) {
            if (touch.identifier === joystickTouchId) updateJoystick(touch);
        }
    }, { passive: false });

    joystickArea.addEventListener('touchend', (e) => {
        e.preventDefault();
        joystickActive = false;
        joystickX = 0; joystickY = 0;
        joystickKnob.style.transform = 'translate(-50%, -50%)';
        joystickTouchId = null;
    }, { passive: false });

    joystickArea.addEventListener('touchcancel', () => {
        joystickActive = false;
        joystickX = 0; joystickY = 0;
        joystickKnob.style.transform = 'translate(-50%, -50%)';
        joystickTouchId = null;
    });

    function updateJoystick(touch) {
        const rect = joystickArea.getBoundingClientRect();
        const cx = rect.left + rect.width/2;
        const cy = rect.top + rect.height/2;
        const dx = touch.clientX - cx;
        const dy = touch.clientY - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxDist = rect.width/2 - 25;
        if (dist > maxDist) {
            const angle = Math.atan2(dy, dx);
            const nx = Math.cos(angle) * maxDist;
            const ny = Math.sin(angle) * maxDist;
            joystickX = nx / maxDist;
            joystickY = ny / maxDist;
            joystickKnob.style.transform = `translate(${nx - 25}px, ${ny - 25}px)`;
        } else {
            joystickX = dx / maxDist;
            joystickY = dy / maxDist;
            joystickKnob.style.transform = `translate(${dx - 25}px, ${dy - 25}px)`;
        }
    }

    // --- КНОПКИ ---
    kickBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        kickPressed = true;
        kickBtn.style.transform = 'scale(0.92)';
        kickBtn.style.background = 'rgba(255,215,0,0.5)';
    }, { passive: false });

    kickBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        kickBtn.style.transform = 'scale(1)';
        kickBtn.style.background = 'rgba(255,215,0,0.25)';
    }, { passive: false });

    kickBtn.addEventListener('touchcancel', () => {
        kickBtn.style.transform = 'scale(1)';
        kickBtn.style.background = 'rgba(255,215,0,0.25)';
    });

    tackleBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        tacklePressed = true;
        tackleBtn.style.transform = 'scale(0.92)';
        tackleBtn.style.background = 'rgba(0,100,255,0.5)';
    }, { passive: false });

    tackleBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        tackleBtn.style.transform = 'scale(1)';
        tackleBtn.style.background = 'rgba(0,100,255,0.25)';
    }, { passive: false });

    tackleBtn.addEventListener('touchcancel', () => {
        tackleBtn.style.transform = 'scale(1)';
        tackleBtn.style.background = 'rgba(0,100,255,0.25)';
    });

    // --- СТАРТ ---
    buildPlayerMenu();
    loop();
</script>
</body>
</html>
